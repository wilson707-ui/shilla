<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شلّتنا</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6ff; --ink:#23155c; --card:#fff; --muted:#6b5fa3;
  --pink:#ff4d8d; --yellow:#ffd84d; --mint:#7de2c3; --sky:#7fb6ff; --line:#23155c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171033;--ink:#f1ecff;--card:#251a52;--muted:#b7aae6;--line:#f1ecff}
}
:root[data-theme="dark"]{--bg:#171033;--ink:#f1ecff;--card:#251a52;--muted:#b7aae6;--line:#f1ecff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:"Lalezar","Tajawal",sans-serif;font-weight:400;font-size:clamp(44px,12vw,84px);line-height:1.05;margin:0;outline:none}
h1:focus{box-shadow:0 4px 0 var(--pink)}
.sub{color:var(--muted);margin:6px 0 22px;font-size:17px}
.count{display:inline-block;background:var(--yellow);color:#23155c;border:2.5px solid var(--line);border-radius:999px;padding:2px 16px;font-weight:700;margin-inline-start:8px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
input{font:inherit;color:var(--ink);background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
input::placeholder{color:var(--muted)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#search{flex:1 1 220px}
button{font:inherit;font-weight:700;cursor:pointer;border:2.5px solid var(--line);border-radius:14px;padding:10px 18px;background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--line)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.card{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:20px 16px 16px;text-align:center;box-shadow:5px 5px 0 var(--line)}
.card:nth-child(odd){transform:rotate(-1.2deg)}
.card:nth-child(even){transform:rotate(1.2deg)}
.av{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-family:"Lalezar",sans-serif;font-size:42px;color:#23155c}
.name{font-weight:700;font-size:20px;margin:0}
.role{display:inline-block;margin:6px 0 10px;padding:0 12px;border-radius:999px;border:2px solid var(--line);font-size:14px}
.ig{display:block;direction:ltr;color:var(--pink);font-weight:700;text-decoration:none;word-break:break-all}
.ig:hover{text-decoration:underline}
.del{position:absolute;top:8px;inset-inline-start:8px;width:30px;height:30px;padding:0;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:none;font-size:15px;line-height:1}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;font-size:18px}
dialog{border:2.5px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);padding:22px;width:min(380px,92vw);box-shadow:6px 6px 0 var(--line)}
dialog::backdrop{background:rgba(23,16,51,.55)}
dialog h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:30px;margin:0 0 12px}
dialog label{display:block;margin-bottom:12px;font-weight:500}
dialog input{width:100%;margin-top:4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.row .ghost{background:var(--card);color:var(--ink)}
.err{color:var(--pink);min-height:1.4em;margin:0 0 6px;font-size:15px}

.card{cursor:pointer}
.card:hover{box-shadow:7px 7px 0 var(--line)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av{overflow:hidden}
.hint{color:var(--muted);font-size:14px;margin:4px 0 0}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mhead .av{width:56px;height:56px;font-size:28px;margin:0;flex:none}
.mhead h2{margin:0}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:8px 6px;font-size:15px;background:var(--card);color:var(--ink);box-shadow:none}
.tabs button[aria-selected="true"]{background:var(--yellow);color:#23155c;box-shadow:3px 3px 0 var(--line)}
.big{direction:ltr;font-family:"Lalezar",sans-serif;font-size:34px;word-break:break-all;margin:6px 0 14px;text-align:center}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.acts a{text-decoration:none;display:inline-block}
.acts .alt{background:var(--card);color:var(--ink)}
.photo{width:200px;height:200px;margin:0 auto 14px;border-radius:50%;border:2.5px solid var(--line);overflow:hidden;display:grid;place-items:center;font-family:"Lalezar",sans-serif;font-size:90px;color:#23155c}
.photo img{width:100%;height:100%;object-fit:cover}
.moods{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.moods button{width:44px;height:44px;padding:0;font-size:22px;background:var(--card);box-shadow:none;border-radius:50%}
.moods button[aria-pressed="true"]{background:var(--mint);box-shadow:2px 2px 0 var(--line)}
textarea{font:inherit;color:var(--ink);background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;min-height:80px;resize:vertical}
.fl{font-weight:700;margin:0 0 4px}
.joined{margin:10px 0 0;color:var(--muted)}
.alt2{background:var(--yellow);color:#23155c}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.admin{background:none;border:none;box-shadow:none;color:var(--muted);font-size:13px;padding:4px 0;margin-top:30px;text-decoration:underline;font-weight:400}
.cx{display:flex;justify-content:flex-end;margin-top:16px}
.cx button{background:var(--card);color:var(--ink)}

.views{display:flex;gap:8px;margin:0 0 20px}
.views button{flex:1;background:var(--card);color:var(--ink);box-shadow:none}
.views button[aria-selected="true"]{background:var(--yellow);color:#23155c;box-shadow:3px 3px 0 var(--line)}
.gp{background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:18px;margin-bottom:22px;box-shadow:5px 5px 0 var(--line)}
.gp h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:30px;margin:0 0 10px}
.rbox{text-align:center}
.rbox .av{width:120px;height:120px;font-size:56px;margin:0 auto 8px}
.rname{font-weight:700;font-size:22px;min-height:1.4em}
.letter{font-family:"Lalezar",sans-serif;font-size:96px;line-height:1.1;text-align:center;color:var(--pink)}
.timer{text-align:center;font-weight:700;font-size:20px;min-height:1.6em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{font-weight:700;font-size:14px}
.fgrid input,.pname{display:block;width:100%;margin-top:3px}
.res{margin-top:14px;overflow-x:auto}
.res table{border-collapse:collapse;width:100%;min-width:430px}
.res th,.res td{border:2px solid var(--line);padding:6px 8px;text-align:center}
.res .win td{background:var(--mint);color:#23155c;font-weight:700}
.res s{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chip{border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:14px;background:var(--mint);color:#23155c}
.chip.out{background:var(--card);color:var(--muted);text-decoration:line-through;opacity:.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="title" spellcheck="false" aria-label="اسم القروب">شلّتنا 💜</h1>
  <p class="sub"><span id="subtxt">جاري التحميل…</span> <span class="count" id="count"></span></p>
  <nav class="views"><button type="button" id="tabM" aria-selected="true">الأعضاء</button><button type="button" id="tabG" aria-selected="false">الألعاب 🎮</button></nav>
  <div id="vMembers">
  <div class="tools">
    <input id="search" type="search" placeholder="دوّر على عضو…" aria-label="بحث">
    <button id="add" type="button" hidden>أضف نفسك</button>
    <button id="addOther" type="button" class="alt2" hidden>أضف عضو</button>
  </div>
  <section class="grid" id="grid" aria-live="polite"></section>
  </div>
  <div id="vGames" hidden>
    <p class="hint" id="whoG" style="text-align:center;margin:0 0 14px"></p>
    <section class="gp rbox"><h2>🎡 روليت الإقصاء</h2>
      <p class="hint" id="rStatus"></p>
      <canvas id="rCv" width="340" height="340" style="width:100%;max-width:340px;display:block;margin:0 auto"></canvas>
      <div class="av" id="rAv" hidden style="margin-top:12px"></div>
      <div class="rname" id="rName"></div>
      <div id="rChips" class="chips"></div>
      
      <div class="acts" style="margin-top:10px"><button id="rJoin" type="button" hidden>انضم 🙋</button><button id="rStart" type="button" class="alt2" hidden>ابدأ لعبة جديدة</button></div>
      <p class="hint" id="rMsg"></p>
    </section>
    <section class="gp"><h2>🔤 جماد حيوان نبات إنسان</h2>
      <div class="letter" id="lLetter">؟</div>
      <div class="timer" id="lTimer"></div>
      <p class="hint" id="lState" style="text-align:center"></p>
      
      <div class="fgrid" id="fg" style="margin-top:10px"></div>
      <div class="acts" style="margin-top:12px"><button id="lSubmit" type="button" hidden>أرسل إجاباتي</button><button id="lStart" type="button" class="alt2">ابدأ جولة جديدة</button></div>
      <p class="hint" id="lMsg" style="text-align:center"></p>
      <div class="res" id="lRes"></div>
    </section>
  </div>
</main>

<dialog id="adlg">
  <h2>دخول المشرف</h2>
  <label>كلمة السر<input id="aPass" type="password" autocomplete="off"></label>
  <p class="err" id="aErr"></p>
  <div class="row">
    <button type="button" class="ghost" id="aCancel">إلغاء</button>
    <button type="button" id="aGo">دخول</button>
  </div>
</dialog>
<main style="padding-top:0;margin-top:-40px"><button class="admin" id="adminBtn" type="button">دخول المشرف</button></main>

<dialog id="dlg">
  <h2 id="fTitle">بطاقتك</h2>
  <label>الاسم<input id="fName" maxlength="30" autocomplete="off"></label>
  <label>يوزر الانستا<input id="fHandle" maxlength="30" dir="ltr" placeholder="username" autocomplete="off"></label>
  <label>وصف قصير (اختياري)<input id="fRole" maxlength="20" placeholder="مثال: ملك الميمز" autocomplete="off"></label>
  <p class="err" id="err"></p>
  <div class="row">
    <button type="button" class="ghost" id="cancel">إلغاء</button>
    <button type="button" id="save">حفظ</button>
  </div>
</dialog>


<dialog id="mdlg">
  <div class="mhead"><div class="av" id="mAv"></div><h2 id="mName"></h2></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-t="id">المعرّف</button>
    <button type="button" role="tab" data-t="photo">الصورة</button>
    <button type="button" role="tab" data-t="card">البطاقة</button>
  </div>
  <div id="panel"></div>
  <div class="cx"><button type="button" id="mClose">إغلاق</button></div>
</dialog>

<script>
(function(){
  /* ====== الصق هنا بيانات Supabase (الخطوة 3 في الشرح) ====== */
  var CFG={ url:"https://rtbaphalqdncmjbtqeke.supabase.co", key:"sb_publishable_Li63AJTD1kPGVtU93Nid-w_N23aSkc2" };
  /* ========================================================== */
  var COLORS=["#ff4d8d","#ffd84d","#7de2c3","#7fb6ff","#ffa66b","#c9a7ff"];
  var MOODS=["😎","🥰","😂","🔥","😴","🤪"];
  var $=function(id){return document.getElementById(id);};
  var grid=$("grid"), q=$("search"), dlg=$("dlg"), err=$("err"), mdlg=$("mdlg"), adlg=$("adlg"),
      panel=$("panel"), title=$("title"), subtxt=$("subtxt");
  var docs=[], cur=null, formId=null, loaded=false, failed=false, adminPass="", tokens={};
  try{tokens=JSON.parse(localStorage.getItem("igTokens")||"{}")||{};}catch(e){}
  try{adminPass=sessionStorage.getItem("igAdmin")||"";}catch(e){}
  var isAdmin=!!adminPass;

  function el(tag,cls,txt){var x=document.createElement(tag); if(cls)x.className=cls; if(txt!=null)x.textContent=txt; return x;}
  function colorOf(m){return COLORS[Math.max(0,docs.findIndex(function(x){return x.id===m.id;}))%COLORS.length];}
  function fillAv(box,m){
    box.textContent=""; box.style.background=colorOf(m);
    if(m.p){var i=document.createElement("img"); i.src=m.p; i.alt=m.n; box.appendChild(i);}
    else box.textContent=Array.from(m.n)[0]||"؟";
  }
  function url(m){return "https://www.instagram.com/"+encodeURIComponent(m.h)+"/";}
  function hasMine(){return docs.some(function(m){return tokens[m.id];});}
  function canEditM(m){return isAdmin || !!tokens[m.id];}

  /* ---- Supabase (REST) ---- */
  function hdr(){
    var h={apikey:CFG.key,"Content-Type":"application/json"};
    if(CFG.key.indexOf("eyJ")===0) h.Authorization="Bearer "+CFG.key;
    return h;
  }
  function api(path,opt){
    return fetch(CFG.url+"/rest/v1/"+path,Object.assign({headers:hdr()},opt)).then(function(r){
      if(!r.ok) return r.text().then(function(t){throw new Error(t||r.status);});
      return r.status===204?null:r.json();
    });
  }
  function rpc(fn,args){return api("rpc/"+fn,{method:"POST",body:JSON.stringify(args)});}

  function load(){
    return api("members?select=id,n,h,r,p,bio,mood,d&order=d.asc").then(function(rows){
      docs=rows; loaded=true; failed=false; render();
    }).catch(function(){ loaded=true; failed=true; render(); });
  }
  function loadTitle(){
    api("settings?select=v&k=eq.title").then(function(r){
      if(r&&r[0]&&r[0].v&&document.activeElement!==title) title.textContent=r[0].v;
    }).catch(function(){});
  }
  function fields(m){
    return {p_n:m.n,p_h:m.h,p_r:m.r||"",p_p:m.p||"",p_bio:m.bio||"",p_mood:m.mood||""};
  }
  function saveMember(m){
    if(isAdmin) return rpc("admin_update",Object.assign({p_pass:adminPass,p_id:m.id},fields(m)));
    return rpc("update_member",Object.assign({p_id:m.id,p_token:tokens[m.id]},fields(m)));
  }
  function patch(m,ch){Object.assign(m,ch); return saveMember(m);}

  function subline(){
    if(failed) subtxt.textContent="ما قدرنا نوصل للبيانات. تأكد من النت وإعدادات Supabase. ";
    else if(isAdmin) subtxt.textContent="أنت المشرف: تقدر تحذف وتعدّل وتغيّر العنوان بالضغط عليه. ";
    else if(hasMine()) subtxt.textContent="اضغط على بطاقتك وأضف صورتك ونبذتك. ";
    else subtxt.textContent="اضغط «أضف نفسك» وتظهر للكل. ";
  }
  function buttons(){
    $("add").hidden=!(loaded&&!failed&&!hasMine());
    $("addOther").hidden=!(isAdmin&&!failed);
    $("adminBtn").textContent=isAdmin?"خروج من وضع المشرف":"دخول المشرف";
    title.contentEditable=isAdmin?"true":"false";
  }

  function render(){
    var term=q.value.trim().toLowerCase();
    grid.textContent=""; var shown=0;
    docs.forEach(function(m){
      if(term && (m.n+" "+m.h+" "+(m.r||"")).toLowerCase().indexOf(term)<0) return;
      shown++;
      var c=el("article","card"); c.tabIndex=0; c.setAttribute("role","button"); c.setAttribute("aria-label","افتح "+m.n);
      var av=el("div","av"); fillAv(av,m);
      if(isAdmin){
        var d=el("button","del","✕"); d.type="button"; d.setAttribute("aria-label","حذف "+m.n);
        var armed=false;
        d.onclick=function(e){
          e.stopPropagation();
          if(!armed){armed=true; d.textContent="؟"; setTimeout(function(){armed=false; d.textContent="✕";},2500); return;}
          rpc("admin_delete",{p_pass:adminPass,p_id:m.id}).then(load).catch(function(){});
        };
        c.appendChild(d);
      }
      c.appendChild(av);
      c.appendChild(el("h3","name",m.n+(m.mood?" "+m.mood:"")));
      if(m.r) c.appendChild(el("span","role",m.r));
      c.appendChild(el("span","ig","@"+m.h));
      c.onclick=function(){openMember(m);};
      c.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault(); openMember(m);} };
      grid.appendChild(c);
    });
    if(!shown) grid.appendChild(el("p","empty", !loaded?"جاري التحميل…": failed?"":docs.length?"ما لقينا أحد بهالاسم.":"القروب فاضي. كن أول واحد يضيف نفسه!"));
    $("count").textContent=docs.length+" عضو";
    subline(); buttons();
  }

  /* ---- member popup ---- */
  function openMember(m){ cur=m; $("mName").textContent=m.n; fillAv($("mAv"),m); tab("id"); mdlg.showModal(); }
  function tab(name){
    Array.prototype.forEach.call(mdlg.querySelectorAll(".tabs button"),function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-t")===name?"true":"false");
    });
    panel.textContent="";
    if(name==="id") tabId(); else if(name==="photo") tabPhoto(); else tabCard();
  }
  Array.prototype.forEach.call(mdlg.querySelectorAll(".tabs button"),function(b){
    b.onclick=function(){tab(b.getAttribute("data-t"));};
  });
  $("mClose").onclick=function(){mdlg.close();};
  mdlg.addEventListener("close",function(){render();});

  function tabId(){
    panel.appendChild(el("div","big","@"+cur.h));
    var a=el("div","acts");
    var gb=el("button",null,"افتح الحساب"); gb.type="button";
    gb.onclick=function(){window.open(url(cur),"_blank","noopener");};
    var cp=el("button","alt","انسخ المعرّف"); cp.type="button";
    cp.onclick=function(){
      var txt="@"+cur.h, ok=function(){cp.textContent="تم النسخ ✓";};
      try{ navigator.clipboard.writeText(txt).then(ok,fb); }catch(e){fb();}
      function fb(){
        var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
        try{document.execCommand("copy"); ok();}catch(e){cp.textContent=txt;}
        document.body.removeChild(ta);
      }
    };
    a.appendChild(gb); a.appendChild(cp); panel.appendChild(a);
    if(canEditM(cur)){
      var ed=el("button","alt","عدّل البيانات"); ed.type="button";
      ed.onclick=function(){mdlg.close(); openForm(cur,"edit");};
      var w=el("div","acts"); w.style.marginTop="12px"; w.appendChild(ed); panel.appendChild(w);
    }
  }

  function tabPhoto(){
    var ph=el("div","photo"); fillAv(ph,cur); panel.appendChild(ph);
    if(!canEditM(cur)) return;
    var a=el("div","acts");
    var file=document.createElement("input"); file.type="file"; file.accept="image/*"; file.hidden=true;
    var up=el("button",null,cur.p?"غيّر الصورة":"ارفع صورة البروفايل"); up.type="button";
    up.onclick=function(){file.click();};
    a.appendChild(up);
    if(cur.p){
      var rm=el("button","alt","احذف الصورة"); rm.type="button";
      rm.onclick=function(){ patch(cur,{p:""}).catch(function(){}); fillAv($("mAv"),cur); tab("photo"); };
      a.appendChild(rm);
    }
    panel.appendChild(a); panel.appendChild(file);
    panel.appendChild(el("p","hint","الانستا ما يسمح للمواقع تسحب الصور تلقائي، خذ لقطة شاشة لبروفايلك وارفعها هنا."));
    file.onchange=function(){
      var f=file.files&&file.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          var S=256,cv=document.createElement("canvas"); cv.width=cv.height=S;
          var side=Math.min(im.width,im.height), sx=(im.width-side)/2, sy=(im.height-side)/2;
          cv.getContext("2d").drawImage(im,sx,sy,side,side,0,0,S,S);
          patch(cur,{p:cv.toDataURL("image/jpeg",0.7)}).then(function(){fillAv($("mAv"),cur); tab("photo");})
            .catch(function(){panel.appendChild(el("p","err","ما انحفظت الصورة، جرّب مرة ثانية."));});
        };
        im.src=r.result;
      };
      r.readAsDataURL(f);
    };
  }

  function tabCard(){
    var ed=canEditM(cur);
    panel.appendChild(el("p","fl","المزاج اليوم"));
    var mo=el("div","moods");
    MOODS.forEach(function(e){
      var b=el("button",null,e); b.type="button"; b.setAttribute("aria-pressed",cur.mood===e?"true":"false");
      if(!ed) b.disabled=true;
      b.onclick=function(){ patch(cur,{mood:(cur.mood===e)?"":e}).catch(function(){}); tab("card"); };
      mo.appendChild(b);
    });
    panel.appendChild(mo);
    panel.appendChild(el("p","fl","نبذة"));
    var ta=document.createElement("textarea"); ta.maxLength=140;
    ta.placeholder=ed?"اكتب أي شي… (حركة مشهورة، موقف مضحك)":"ما كتب شي للحين.";
    ta.value=cur.bio||""; ta.readOnly=!ed;
    var tm=null, target=cur;
    ta.oninput=function(){ clearTimeout(tm); tm=setTimeout(function(){tm=null; patch(target,{bio:ta.value}).catch(function(){});},700); };
    ta.onblur=function(){ if(tm&&ed){clearTimeout(tm); tm=null; patch(target,{bio:ta.value}).catch(function(){});} };
    panel.appendChild(ta);
    var d=new Date(cur.d), ds="";
    try{ds=d.toLocaleDateString("ar",{year:"numeric",month:"long",day:"numeric"});}catch(e){ds=d.toDateString();}
    panel.appendChild(el("p","joined","انضم للقروب: "+ds));
  }

  /* ---- add / edit form ---- */
  function openForm(m,mode){
    err.textContent=""; formId=m?m.id:null; dlg.dataset.mode=mode;
    $("fTitle").textContent= mode==="edit"?"عدّل البيانات": mode==="other"?"عضو جديد":"بطاقتك";
    $("fName").value=m?m.n:""; $("fHandle").value=m?m.h:""; $("fRole").value=m?(m.r||""):"";
    dlg.showModal(); $("fName").focus();
  }
  $("add").onclick=function(){openForm(null,"self");};
  $("addOther").onclick=function(){openForm(null,"other");};
  $("cancel").onclick=function(){dlg.close();};
  $("save").onclick=function(){
    var n=$("fName").value.trim(), h=$("fHandle").value.trim().replace(/^@/,""), r=$("fRole").value.trim();
    if(!n){err.textContent="اكتب الاسم."; return;}
    if(!/^[A-Za-z0-9._]{1,30}$/.test(h)){err.textContent="اليوزر لازم يكون بحروف إنجليزي أو أرقام أو . _"; return;}
    var mode=dlg.dataset.mode, btn=$("save"); btn.disabled=true;
    var job;
    if(mode==="edit"){
      var m=docs.find(function(x){return x.id===formId;});
      job=patch(m,{n:n,h:h,r:r});
    } else {
      job=rpc("add_member",{p_n:n,p_h:h,p_r:r}).then(function(res){
        if(mode==="self"&&res&&res.id){
          tokens[res.id]=res.token;
          try{localStorage.setItem("igTokens",JSON.stringify(tokens));}catch(e){}
        }
      });
    }
    job.then(function(){dlg.close(); return load();})
       .catch(function(){err.textContent="ما انحفظت، جرّب مرة ثانية.";})
       .then(function(){btn.disabled=false;});
  };

  /* ---- admin ---- */
  $("adminBtn").onclick=function(){
    if(isAdmin){ isAdmin=false; adminPass=""; try{sessionStorage.removeItem("igAdmin");}catch(e){} render(); return; }
    $("aErr").textContent=""; $("aPass").value=""; adlg.showModal(); $("aPass").focus();
  };
  $("aCancel").onclick=function(){adlg.close();};
  $("aGo").onclick=function(){
    var p=$("aPass").value;
    rpc("admin_check",{p_pass:p}).then(function(ok){
      if(ok===true){ isAdmin=true; adminPass=p; try{sessionStorage.setItem("igAdmin",p);}catch(e){} adlg.close(); render(); }
      else $("aErr").textContent="كلمة السر غلط.";
    }).catch(function(){$("aErr").textContent="ما قدرنا نتحقق. تأكد من الإعدادات.";});
  };
  title.addEventListener("blur",function(){
    var t=title.textContent.trim();
    if(isAdmin&&t) rpc("admin_set_title",{p_pass:adminPass,p_t:t}).catch(function(){});
  });
  title.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();title.blur();}});

  /* ---- identity from my card ---- */
  function myMember(){return docs.find(function(m){return tokens[m.id];})||null;}
  function myName(){
    var m=myMember(); if(!m) return "";
    var dup=docs.some(function(x){return x.id!==m.id&&x.n===m.n;});
    return dup?(m.n.slice(0,12)+" @"+m.h).slice(0,20):m.n;
  }
  function setWho(){
    var n=myName();
    $("whoG").textContent=n?("تلعب باسم: "+n):"ما عندك بطاقة. سوّ بطاقتك من تبويب «الأعضاء» وبعدها العب 👇";
  }
  function needCard(id){
    $(id).textContent="لازم تسوي بطاقتك أول 👇";
    showView("m"); if(!hasMine()) openForm(null,"self");
  }

  /* ---- tabs + games ---- */
  var rd=null,pollT=null,tickT=null,sent=false,shown=null,fetching=false;
  var CATS=["جماد","حيوان","نبات","إنسان"], inps=[];
  CATS.forEach(function(c){
    var l=el("label",null,c), i=document.createElement("input"); i.maxLength=20; i.autocomplete="off";
    i.oninput=function(){sent=false;}; l.appendChild(i); $("fg").appendChild(l); inps.push(i);
  });
  function setInputs(on){inps.forEach(function(i){i.disabled=!on;});}
  function norm(s){s=(s||"").trim(); [["أ","ا"],["إ","ا"],["آ","ا"],["ى","ي"],["ة","ه"]].forEach(function(p){s=s.split(p[0]).join(p[1]);}); return s;}

  function showView(v){
    $("vMembers").hidden=v!=="m"; $("vGames").hidden=v!=="g";
    $("tabM").setAttribute("aria-selected",v==="m"?"true":"false");
    $("tabG").setAttribute("aria-selected",v==="g"?"true":"false");
    if(v==="g"){ rStartLoop(); pollRound(); if(!pollT) pollT=setInterval(pollRound,3000); if(!tickT) tickT=setInterval(updateGame,500); }
    else { rStopLoop(); clearInterval(pollT); clearInterval(tickT); pollT=tickT=null; }
  }
  $("tabM").onclick=function(){showView("m");};
  $("tabG").onclick=function(){showView("g");};

  /* roulette: elimination, shared */
  var rg=null,rps=[],rPlan=null,rOff=0,rKey="",rPollT=null,rRaf=null,rSig="";
  var WC=["#ff4d8d","#7fb6ff","#ffd84d","#7de2c3","#c9a7ff","#ffa66b"];
  function prng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function buildPlan(seed,names){
    var rng=prng(seed),rem=names.slice().sort(),rounds=[];
    while(rem.length>1){var k=Math.floor(rng()*rem.length),sp=4+Math.floor(rng()*3);rounds.push({rem:rem.slice(),i:k,out:rem[k],spins:sp});rem.splice(k,1);}
    return {rounds:rounds,winner:rem[0]||null,n:names.length};
  }
  function rPollOnce(){
    if(!loaded||failed) return;
    var t0=Date.now();
    rpc("server_time",{}).then(function(st){rOff=new Date(st).getTime()-(t0+Date.now())/2;}).catch(function(){});
    api("roulette_games?select=id,seed,join_ends_at&order=created_at.desc&limit=1").then(function(r){
      var g=r&&r[0]; if(!g){rg=null;rPlan=null;return;}
      if(!rg||rg.id!==g.id){rg=g;rps=[];rPlan=null;rKey="";}
      var e=Date.now()+rOff-new Date(g.join_ends_at).getTime();
      if(e<2500||!rPlan) return api("roulette_players?select=player&game_id=eq."+g.id).then(function(p){
        rps=p.map(function(x){return x.player;});
        if(e>=0){var k=rps.slice().sort().join("|"); if(k!==rKey){rKey=k;rPlan=buildPlan(g.seed,rps);}}
      });
    }).catch(function(){});
  }
  function drawWheel(ctx,W,names,theta){
    var R=W/2-10,cx=W/2,m=names.length||1,seg=Math.PI*2/m;
    for(var i=0;i<m;i++){
      ctx.beginPath();ctx.moveTo(cx,cx);ctx.arc(cx,cx,R,theta+i*seg,theta+(i+1)*seg);ctx.closePath();
      ctx.fillStyle=WC[i%WC.length];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#23155c";ctx.stroke();
      ctx.save();ctx.translate(cx,cx);ctx.rotate(theta+(i+.5)*seg);ctx.fillStyle="#23155c";
      ctx.font="700 "+(m>10?13:17)+"px Tajawal,sans-serif";ctx.textAlign="right";ctx.textBaseline="middle";
      ctx.fillText((names[i]||"؟").slice(0,10),R-12,0);ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cx,16,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#23155c";ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-14,2);ctx.lineTo(cx+14,2);ctx.lineTo(cx,30);ctx.closePath();
    ctx.fillStyle="#ff4d8d";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#23155c";ctx.stroke();
  }
  function setChips(rem,out){
    var sig=rem.join("|")+"#"+out.join("|"); if(sig===rSig) return; rSig=sig;
    var box=$("rChips"); box.textContent="";
    rem.forEach(function(n){box.appendChild(el("span","chip",n));});
    out.forEach(function(n){box.appendChild(el("span","chip out",n));});
  }
  function showWho(name){
    var m=docs.find(function(x){return x.n===name;}), av=$("rAv");
    if(!name){av.hidden=true;$("rName").textContent="";return;}
    av.hidden=false; fillAv(av,m||{n:name,id:name}); $("rName").textContent=name;
  }
  function rFrame(){
    rRaf=requestAnimationFrame(rFrame);
    var cv=$("rCv"),ctx=cv.getContext("2d"),W=cv.width,st=$("rStatus");
    ctx.clearRect(0,0,W,W);
    var join=$("rJoin"),start=$("rStart"); join.hidden=true;start.hidden=true;
    if(!rg){st.textContent="ما فيه لعبة شغالة. ابدأ وحدة!";start.hidden=false;drawWheel(ctx,W,["؟"],0);setChips([],[]);showWho("");return;}
    var e=Date.now()+rOff-new Date(rg.join_ends_at).getTime();
    if(e<0){
      st.textContent="🙋 التسجيل مفتوح: باقي "+Math.ceil(-e/1000)+" ثانية";join.hidden=false;
      drawWheel(ctx,W,rps.length?rps:["؟"],e/1500);setChips(rps,[]);showWho("");return;
    }
    if(!rPlan){st.textContent="جاري التحضير…";drawWheel(ctx,W,["؟"],0);return;}
    var n=rPlan.n;
    if(n<2){st.textContent="ما كفى لاعبين (لازم 2 على الأقل) 😅";start.hidden=false;drawWheel(ctx,W,rps.length?rps:["؟"],0);setChips(rps,[]);showWho("");return;}
    var u=e-3000;
    if(u<0){st.textContent="تبدأ اللعبة بعد "+Math.ceil(-u/1000)+" ثانية…";drawWheel(ctx,W,rPlan.rounds[0].rem,0);setChips(rPlan.rounds[0].rem,[]);showWho("");return;}
    var r=Math.floor(u/9000);
    if(r>=n-1){
      st.textContent="🏆 الفائز: "+rPlan.winner;start.hidden=false;
      drawWheel(ctx,W,[rPlan.winner],0);setChips([rPlan.winner],rPlan.rounds.map(function(x){return x.out;}));showWho(rPlan.winner);return;
    }
    var rd=rPlan.rounds[r],t=u-r*9000,k=Math.min(t/5000,1),seg=Math.PI*2/rd.rem.length;
    var thF=-Math.PI/2-(rd.i+.5)*seg-Math.PI*2*rd.spins;
    drawWheel(ctx,W,rd.rem,thF*(1-Math.pow(1-k,3)));
    var outs=rPlan.rounds.slice(0,r).map(function(x){return x.out;});
    if(t<5000){st.textContent="🎡 الجولة "+(r+1)+" من "+(n-1)+"… العجلة تلف";setChips(rd.rem,outs);showWho("");}
    else{
      st.textContent="❌ طلع: "+rd.out;outs.push(rd.out);
      setChips(rd.rem.filter(function(x){return x!==rd.out;}),outs);showWho(rd.out);
    }
  }
  function rStartLoop(){ rPollOnce(); if(!rPollT) rPollT=setInterval(rPollOnce,2000); if(!rRaf) rFrame(); }
  function rStopLoop(){ clearInterval(rPollT); rPollT=null; if(rRaf){cancelAnimationFrame(rRaf);rRaf=null;} }
  $("rJoin").onclick=function(){
    var name=myName(); if(!name){needCard("rMsg");return;}
    rpc("join_roulette",{p_game:rg.id,p_player:name}).then(function(){$("rMsg").textContent="انضممت ✓";rPollOnce();})
      .catch(function(){$("rMsg").textContent="انتهى وقت التسجيل.";});
  };
  $("rStart").onclick=function(){
    $("rMsg").textContent="";
    rpc("start_roulette",{}).then(function(){rPollOnce();}).catch(function(){$("rMsg").textContent="فيه لعبة شغالة الحين.";});
  };

  /* letters game */
  function pollRound(){
    if(!loaded||failed) return;
    api("game_rounds?select=id,letter,ends_at&order=created_at.desc&limit=1").then(function(r){
      var x=r&&r[0]; if(!x) return;
      if(!rd||rd.id!==x.id){
        rd=x; sent=false; shown=null; fetching=false;
        inps.forEach(function(i){i.value="";}); $("lRes").textContent=""; $("lMsg").textContent="";
      }
      updateGame();
    }).catch(function(){});
  }
  function updateGame(){
    setWho();
    if(!rd){ $("lLetter").textContent="؟"; $("lTimer").textContent=""; $("lState").textContent="ما فيه جولة شغالة. ابدأ وحدة! 🎲"; setInputs(false); return; }
    var left=Math.ceil((new Date(rd.ends_at).getTime()-Date.now())/1000);
    $("lLetter").textContent=rd.letter;
    if(left>0){
      $("lState").textContent="اكتب كلمة تبدأ بهالحرف في كل خانة"; $("lTimer").textContent="⏰ "+left;
      setInputs(true); $("lStart").hidden=true; $("lSubmit").hidden=false; return;
    }
    $("lTimer").textContent="انتهى الوقت"; $("lState").textContent=""; setInputs(false);
    $("lSubmit").hidden=true; $("lStart").hidden=false;
    if(!sent && left>-3 && myName() && inps.some(function(i){return i.value.trim();})) submit(true);
    if(left<=-4 && shown!==rd.id && !fetching) loadResults();
  }
  function submit(auto){
    var name=myName(); if(!name){ needCard("lMsg"); return; }
    sent=true;
    rpc("submit_answers",{p_round:rd.id,p_player:name,p_a:inps.map(function(i){return i.value.trim().slice(0,20);})})
      .then(function(){ $("lMsg").textContent=auto?"انرسلت إجاباتك ✓":"انحفظت ✓ (تقدر تعدّلها قبل ما يخلص الوقت)"; })
      .catch(function(){ sent=false; $("lMsg").textContent="ما انرسلت، جرّب مرة ثانية."; });
  }
  $("lSubmit").onclick=function(){submit(false);};
  $("lStart").onclick=function(){
    $("lMsg").textContent="";
    rpc("start_round",{}).then(pollRound).catch(function(){ $("lMsg").textContent="فيه جولة شغالة الحين."; pollRound(); });
  };
  function loadResults(){
    fetching=true; var id=rd.id, letter=rd.letter;
    api("game_answers?select=player,a&round_id=eq."+id).then(function(rows){ shown=id; fetching=false; renderRes(rows,letter); })
      .catch(function(){ fetching=false; });
  }
  function renderRes(rows,letter){
    var box=$("lRes"); box.textContent="";
    if(!rows.length){ box.appendChild(el("p","hint","ما أحد شارك بهالجولة 😅")); return; }
    var L=norm(letter);
    var v=rows.map(function(r){return r.a.map(function(x){var n=norm(x); return (n.indexOf(L)===0&&n.length>=2)?n:null;});});
    var sc=rows.map(function(){return 0;});
    for(var c=0;c<4;c++){
      var cnt={}; v.forEach(function(a){ if(a[c]) cnt[a[c]]=(cnt[a[c]]||0)+1; });
      v.forEach(function(a,k){ if(a[c]) sc[k]+=cnt[a[c]]===1?10:5; });
    }
    var order=rows.map(function(_,k){return k;}).sort(function(a,b){return sc[b]-sc[a];});
    var t=el("table"), hr=el("tr");
    ["اللاعب"].concat(CATS,["النقاط"]).forEach(function(h){hr.appendChild(el("th",null,h));}); t.appendChild(hr);
    order.forEach(function(k,pos){
      var tr=el("tr",pos===0&&sc[k]>0?"win":null); tr.appendChild(el("td",null,rows[k].player));
      rows[k].a.forEach(function(x,c){ var td=el("td"); if(!x) td.textContent="—"; else if(v[k][c]) td.textContent=x; else { var s2=document.createElement("s"); s2.textContent=x; td.appendChild(s2); } tr.appendChild(td); });
      tr.appendChild(el("td",null,sc[k])); t.appendChild(tr);
    });
    box.appendChild(t);
    box.appendChild(el("p","hint","الإجابة الفريدة 10 نقاط، المكررة 5، الغلط (المشطوب) 0."));
  }

  q.addEventListener("input",render);
  render();
  if(CFG.url.indexOf("PASTE")===0){ loaded=true; failed=true; render(); subtxt.textContent="باقي تلصق بيانات Supabase في أول الملف. "; return; }
  loadTitle(); load();
  setInterval(function(){ if(!mdlg.open&&!dlg.open&&!adlg.open&&document.visibilityState==="visible"){load();loadTitle();} },20000);
})();
</script>
